[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ratatron"
version = "0.3.0"
description = "Tools of the RATATRON micromouse: link, monitor, calibration"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = ["pyserial"]

[project.optional-dependencies]
cycles = ["unicorn", "pyelftools"]

[project.scripts]
ratatron = "ratatron.cli:main"

[tool.setuptools.packages.find]
include = ["ratatron*"]
