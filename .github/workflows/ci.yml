name: CI

on: [push, pull_request]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e competition -e practice -e dev -e uart_test -e diag_test -e virtual

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/test/host
      - run: python3 -m unittest discover -s software -p 'test_*.py'
